<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>biyou nails — área da cliente</title>
<meta name="robots" content="noindex, nofollow">
<style>
@font-face{font-family:Fogthree;src:url('/fonts/fogthree.woff') format('woff');font-display:swap}
:root{--background:oklch(99% .006 95);--foreground:oklch(32% .03 285);--card:oklch(100% 0 0);--primary:oklch(74% .11 310);--accent:oklch(80% .13 350);--secondary:oklch(96% .02 320);--muted-foreground:oklch(56% .03 290);--border:oklch(93% .015 310);--dot-pink:oklch(76% .16 350)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:84px 20px 20px;background:linear-gradient(160deg,oklch(99% .01 95),oklch(97% .02 330));color:var(--foreground);font-family:"Manrope",-apple-system,"Segoe UI",Roboto,sans-serif}
.box{background:var(--card);border:1px solid var(--border);border-radius:1.75rem;padding:38px 30px;max-width:380px;width:100%;text-align:center;box-shadow:0 18px 40px -24px oklch(40% .08 320 / .45)}
.eyebrow{font-size:.75rem;letter-spacing:.3em;color:var(--muted-foreground);margin:0}
h1{font-family:Fogthree,Georgia,serif;font-weight:400;font-size:1.9rem;margin:12px 0 6px}
p.s{color:var(--muted-foreground);font-size:.88rem;margin:0 0 22px}
input{width:100%;padding:13px;border:1px solid var(--border);border-radius:14px;background:var(--secondary);color:var(--foreground);font:inherit;font-size:1.1rem;letter-spacing:.25em;text-align:center;text-transform:uppercase;outline:none;margin-bottom:14px}
button{width:100%;border:none;border-radius:999px;padding:12px;background:linear-gradient(120deg,var(--accent),var(--primary));color:#fff;font:inherit;font-size:.9rem;cursor:pointer}
.err{color:var(--dot-pink);font-size:.82rem;margin:12px 0 0;min-height:1em}
input.nm{letter-spacing:normal;text-transform:none;font-size:1rem}
a{color:var(--muted-foreground);font-size:.78rem;text-decoration:none;display:inline-block;margin-top:22px}a:hover{color:var(--foreground)}
.sh{position:fixed;top:0;left:0;right:0;z-index:40;background:color-mix(in oklab,var(--card) 55%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.sh-in{max-width:72rem;margin:0 auto;padding:10px 20px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px}
.sh-logo img{height:34px;width:auto;display:block}
.sh-nav{display:none;gap:28px;justify-self:center}
.sh-nav a,.sh-mob a{position:relative;font-size:.875rem;color:var(--muted-foreground);text-decoration:none;transition:color .3s}
.sh-nav a::after{content:"";position:absolute;left:0;bottom:-4px;height:1px;width:0;background:var(--primary);transition:width .3s}
.sh-nav a:hover::after,.sh-nav a.on::after{width:100%}
.sh-nav a:hover,.sh-mob a:hover,.sh a.on{color:var(--foreground)}
.sh-r{display:flex;gap:8px;justify-content:flex-end}
.sh-ic{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:color-mix(in oklab,var(--card) 80%,transparent);display:grid;place-items:center;color:var(--foreground);cursor:pointer;padding:0;font:inherit;text-decoration:none}
.sh-mob{display:none;flex-direction:column;align-items:center;gap:10px;padding:6px 20px 16px}.sh-mob.open{display:flex}
@media(min-width:768px){.sh-in{grid-template-columns:1fr auto 1fr}.sh-nav{display:flex}.sh-burger,.sh-mob{display:none!important}}
</style>
</head>
<body>
<header class="sh"><div class="sh-in"><a href="/index.html#inicio" class="sh-logo" aria-label="biyou nails"><img src="/logo-biyou-light.png" alt="biyou nails"></a><nav class="sh-nav"><a href="/index.html#inicio">início</a><a href="/index.html#fotos">fotos</a><a href="/index.html#duvidas">dúvidas e avisos</a><a href="/index.html#pedidos">pedidos</a><a href="/passo-a-passo.html">passo a passo</a><a href="/acesso.html" class="on">área da cliente</a></nav><div class="sh-r"><a class="sh-ic" href="https://www.instagram.com/biyounails/" target="_blank" rel="noopener noreferrer" aria-label="instagram"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg></a><button class="sh-ic sh-burger" id="shb" type="button" aria-label="abrir menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div></div><nav class="sh-mob" id="shm"><a href="/index.html#inicio">início</a><a href="/index.html#fotos">fotos</a><a href="/index.html#duvidas">dúvidas e avisos</a><a href="/index.html#pedidos">pedidos</a><a href="/passo-a-passo.html">passo a passo</a><a href="/acesso.html" class="on">área da cliente</a></nav></header>
<script>document.getElementById("shb").onclick=function(){document.getElementById("shm").classList.toggle("open")}</script>

<div class="box">
  <p class="eyebrow">biyou nails</p>
  <h1>área da cliente</h1>
  <p class="s">digite seu nome e o código que a biyou te enviou para acompanhar seus pedidos</p>
  <input id="n" class="nm" placeholder="seu nome" autocomplete="name" autofocus>
  <input id="c" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off">
  <button id="b" type="button">entrar</button>
  <p class="err" id="e"></p>
  <a href="/">← voltar ao site</a> &nbsp;·&nbsp; <a href="/admin.html">sou a biyou</a>
</div>
<script>
var n=document.getElementById('n'),c=document.getElementById('c'),e=document.getElementById('e'),b=document.getElementById('b');
function go(){
  e.textContent='';b.disabled=true;b.textContent='entrando…';
  fetch('/api/entrar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:n.value,codigo:c.value})})
  .then(function(r){if(!r.ok)throw 0;return r.json()})
  .then(function(j){location.href='/cliente.html?t='+encodeURIComponent(j.t)})
  .catch(function(){e.textContent='nome ou código incorretos. confira e tente de novo.';b.disabled=false;b.textContent='entrar'});
}
b.onclick=go;n.onkeydown=c.onkeydown=function(ev){if(ev.key==='Enter')go()};
</script>
</body>
</html>
