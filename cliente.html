  var prevBtn = document.getElementById('biyou-yt-prev');
  var nextBtn = document.getElementById('biyou-yt-next');
  var shuffleBtn = document.getElementById('biyou-yt-shuffle');
  var shuffleOn = true;
  // se a pessoa ficar mais tempo que isso fora da aba/site, ao voltar
  // trocamos de música em vez de retomar a mesma faixa/ponto salvo
  var AWAY_RESET_MS = 20 * 60 * 1000; // 20 minutos
  // ordem de reprodução controlada pelo site (mais confiável que o
  // setShuffle()/nextVideo() nativos do player do YouTube, que são
  // conhecidos por não embaralhar de forma consistente)
  var playlistIds = [];
  var playOrder = [];
  var orderPos = -1;
  function shuffleArray(arr){
    for(var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }
  // monta a ordem de reprodução; se anchorToCurrent=true, mantém a faixa
  // atual tocando e só reembaralha as próximas
  function buildOrder(anchorToCurrent){
    var ids = playlistIds.map(function(_, i){ return i; });
    if(shuffleOn) shuffleArray(ids);
    var newPos = 0;
    if(anchorToCurrent && orderPos > -1 && playOrder.length){
      var curOriginalIdx = playOrder[orderPos];
      var foundPos = ids.indexOf(curOriginalIdx);
      if(shuffleOn){
        if(foundPos > 0){ ids.splice(foundPos,1); ids.unshift(curOriginalIdx); }
        newPos = 0;
      } else {
        newPos = foundPos > -1 ? foundPos : 0;
      }
    }
    playOrder = ids;
    orderPos = newPos;
  }
  function playAt(pos, autoplay){
    if(!playOrder.length) return;
    orderPos = ((pos % playOrder.length) + playOrder.length) % playOrder.length;
    var vid = playlistIds[playOrder[orderPos]];
    if(!vid) return;
    try{
      if(autoplay){ ytPlayer.loadVideoById(vid); }
      else { ytPlayer.cueVideoById(vid); }
    }catch(e){}
  }
  function goNext(autoplay){ playAt(orderPos + 1, autoplay); }
  function goPrev(autoplay){ playAt(orderPos - 1, autoplay); }
  var progressBg = document.getElementById('biyou-yt-progress-bg');
  var progressFill = document.getElementById('biyou-yt-progress-fill');
  var progressDot = document.getElementById('biyou-yt-progress-dot');
  var timeCurrent = document.getElementById('biyou-yt-time-current');
  var timeTotal = document.getElementById('biyou-yt-time-total');
  var orbEl = document.getElementById('biyou-orb');

  function fmt(s){ s = Math.floor(s||0); var m = Math.floor(s/60); var r = s%60; return m+':'+(r<10?'0':'')+r; }

  function createPlayer(){
    if(ytPlayer) return;
    if(!(window.YT && window.YT.Player)) return;
    if(!document.getElementById('biyou-yt-player')) return;
    ytPlayer = new YT.Player('biyou-yt-player', {
      height: '180', width: '320',
      playerVars: { listType: 'playlist', list: YT_PLAYLIST_ID, autoplay: 0, controls: 0, playsinline: 1, rel: 0, enablejsapi: 1, origin: window.location.origin },
      events: { onReady: onPlayerReady, onStateChange: onPlayerStateChange, onError: onPlayerError }
    });
  }

  // a API do YouTube dispara este callback uma unica vez; se ela carregar antes
  // deste script, o callback se perde e o player fica "carregando" para sempre.
  // por isso tambem verificamos por conta propria se a API ja esta disponivel.
  var prevApiReady = window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady = function(){
    if(typeof prevApiReady === 'function'){ try{ prevApiReady(); }catch(e){} }
    createPlayer();
  };

  (function bootstrapYT(){
    if(window.YT && window.YT.Player){ createPlayer(); return; }
    var existing = document.querySelector('script[src*="youtube.com/iframe_api"]');
    if(!existing){
      var tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
    }
    var tries = 0;
    var poll = setInterval(function(){
      tries++;
      if(window.YT && window.YT.Player){ clearInterval(poll); createPlayer(); }
      else if(tries > 80){
        clearInterval(poll);
        if(titleEl) titleEl.textContent = 'não consegui carregar a playlist';
      }
    }, 80);
  })();


  function onPlayerError(e){
    // vídeo bloqueado para incorporação (100/101/150) -> pula para o próximo
    try{
      titleEl.textContent = 'trocando de faixa...';
      setTimeout(function(){ try{ goNext(true); }catch(err){} }, 300);
    }catch(err){}
  }

  function onPlayerReady(){
    ytReady = true;
    window.biyouPlayer = ytPlayer;
    var vol = document.getElementById('biyou-yt-volume');
    var startVol = vol ? parseInt(vol.value, 10) : 30;
    try{ ytPlayer.unMute(); ytPlayer.setVolume(startVol); }catch(e){}

    // pega a lista de vídeos da playlist e monta nossa própria ordem
    // (embaralhada, se shuffleOn), já que o embaralhamento nativo do
    // player do YouTube é pouco confiável entre navegadores
    try{ playlistIds = ytPlayer.getPlaylist ? (ytPlayer.getPlaylist() || []) : []; }catch(e){ playlistIds = []; }
    buildOrder(false);
    if(shuffleBtn){
      shuffleBtn.classList.toggle('is-active', shuffleOn);
      shuffleBtn.setAttribute('aria-pressed', shuffleOn ? 'true' : 'false');
      shuffleBtn.setAttribute('title', shuffleOn ? 'ordem aleatória: ativada' : 'ordem aleatória: desativada');
    }

    // sorteia a faixa inicial (sem tocar) para variar a cada visita
    var savedNow = readSaved();
    // se o estado salvo for de muito tempo atras, tratamos como se nao
    // houvesse estado salvo: sorteia uma faixa nova em vez de retomar
    var awayTooLong = !!(savedNow && savedNow.v && savedNow.at && (Date.now() - savedNow.at) > AWAY_RESET_MS);
    if((!(savedNow && savedNow.v) || awayTooLong) && playlistIds.length > 1){
      playAt(0, false);
      setTimeout(updateTitle, 800);
    } else {
      updateTitle();
    }

    if(toggleBtn) toggleBtn.classList.add('needs-start');
    if(titleEl && titleEl.textContent === 'carregando playlist...'){
      titleEl.textContent = 'biyou playlist \u2014 toque no play';
    }
    restoreSaved(startVol, savedNow, awayTooLong);
    document.dispatchEvent(new CustomEvent('biyou:player-ready'));
  }

  // ---- continuidade entre paginas / recarregamentos ----
  var SAVE_KEY = 'biyou-player-state';
  function readSaved(){
    try{ return JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); }catch(e){ return null; }
  }
  var lastKnownPlaying = false;
  var userPaused = false;
  var lastSaveAt = 0;
  var savePending = false;
  // no mobile, escrever no localStorage a cada frame causa travadas.
  // por isso a gravacao normal e throttled e roda em tempo ocioso;
  // saveState(true) grava na hora (ao sair da pagina/esconder a aba).
  function saveState(force){
    if(!ytReady) return;
    if(force !== true){
      if(Date.now() - lastSaveAt < 900) return;
      if(savePending) return;
      savePending = true;
      var idle = window.requestIdleCallback || function(fn){ return setTimeout(fn, 0); };
      idle(function(){ savePending = false; writeState(); });
      return;
    }
    writeState();
  }
  function writeState(){
    if(!ytReady) return;
    lastSaveAt = Date.now();
    try{
      var d = ytPlayer.getVideoData ? ytPlayer.getVideoData() : null;
      var st = ytPlayer.getPlayerState ? ytPlayer.getPlayerState() : -1;
      if(st === 1 || st === 2) lastKnownPlaying = (st === 1);
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        v: d && d.video_id ? d.video_id : null,
        t: ytPlayer.getCurrentTime ? ytPlayer.getCurrentTime() : 0,
        // buffering (3) durante a troca de aba nao significa pausa do usuario
        playing: st === 1 || (st === 3 && lastKnownPlaying),
        vol: ytPlayer.getVolume ? ytPlayer.getVolume() : 30,
        at: Date.now()
      }));
    }catch(e){}
  }
  window.biyouSavePlayerState = saveState;
  window.addEventListener('pagehide', function(){ saveState(true); });
  window.addEventListener('beforeunload', function(){ saveState(true); });
  // mobile: iOS/Android muitas vezes nao disparam beforeunload/pagehide,
  // entao salvamos ao esconder a aba, ao congelar e ao trocar de app.
  // ao voltar para a aba, retomamos do ponto onde o audio parou (sem seek,
  // para nao gerar recarregamento nem pulo de trecho).
  var hiddenAt = 0;
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'hidden'){ hiddenAt = Date.now(); saveState(true); return; }
    if(!ytReady) return;
    // ficou muito tempo fora da aba: troca de musica em vez de retomar
    var awayMs = hiddenAt ? (Date.now() - hiddenAt) : 0;
    if(awayMs > AWAY_RESET_MS){
      hiddenAt = 0;
      var wasPlaying = !userPaused && lastKnownPlaying;
      try{ goNext(wasPlaying); }catch(e){}
      setTimeout(updateTitle, 400);
      return;
    }
    if(userPaused || !lastKnownPlaying) return;
    try{ if(ytPlayer.getPlayerState() !== 1) ytPlayer.playVideo(); }catch(e){}
    setTimeout(function(){
      if(userPaused) return;
      try{ if(ytPlayer.getPlayerState() !== 1) ytPlayer.playVideo(); }catch(e){}
    }, 500);
  });
  window.addEventListener('freeze', function(){ saveState(true); });
  window.addEventListener('blur', function(){ saveState(true); });
  // rotacao de tela nao deve interromper o audio
  window.addEventListener('orientationchange', function(){
    saveState(true);
    setTimeout(function(){
      if(!ytReady || userPaused) return;
      try{ if(lastKnownPlaying && ytPlayer.getPlayerState() !== 1) ytPlayer.playVideo(); }catch(e){}
    }, 400);
  });
  document.addEventListener('click', function(ev){
    var a = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
    if(a && !a.target && a.getAttribute('href') && a.getAttribute('href').charAt(0) !== '#') saveState(true);
  }, true);
  document.addEventListener('submit', function(){ saveState(true); }, true);
  // volta do cache do navegador: retoma de onde parou
  window.addEventListener('pageshow', function(ev){
    if(!ev.persisted || !ytReady) return;
    try{
      var sv = readSaved();
      if(sv && sv.playing && ytPlayer.getPlayerState() !== 1){ ytPlayer.unMute(); ytPlayer.playVideo(); }
    }catch(e){}
  });

  function restoreSaved(startVol, savedNow, skipTrack){
    var saved = savedNow || readSaved();
    if(!saved || !saved.v) return;
    try{
      if(typeof saved.vol === 'number'){
        ytPlayer.setVolume(saved.vol);
        var volEl = document.getElementById('biyou-yt-volume');
        if(volEl) volEl.value = saved.vol;
      }
      // ficou muito tempo fora: nao retoma a mesma faixa/ponto, so o volume
      if(skipTrack) return;
      var origIdx = playlistIds.indexOf(saved.v);
      var start = Math.max(0, (saved.t || 0) - 0.25);
      // compensa o tempo que a pagina levou para carregar, para a musica
      // continuar exatamente de onde estava (sem repetir nem pular trecho)
      if(saved.playing && saved.at){
        var gap = (Date.now() - saved.at) / 1000;
        if(gap > 0 && gap < 20) start = Math.max(0, (saved.t || 0) + gap - 0.25);
      }
      if(origIdx > -1){
        var pos = playOrder.indexOf(origIdx);
        if(pos > -1) orderPos = pos;
      }
      if(saved.playing){ ytPlayer.loadVideoById({ videoId: saved.v, startSeconds: start }); }
      else { ytPlayer.cueVideoById({ videoId: saved.v, startSeconds: start }); }
      if(saved.playing){
        lastKnownPlaying = true;
        try{ ytPlayer.unMute(); }catch(e){}
        try{ ytPlayer.playVideo(); }catch(e){}
        setTimeout(function(){ try{ if(ytPlayer.getPlayerState() !== 1) ytPlayer.playVideo(); }catch(e){} }, 250);
        // mobile: sem gesto do usuario o audio pode ser bloqueado.
        // a faixa fica pronta no ponto certo e retoma no primeiro toque.
        setTimeout(function(){
          try{
            if(ytPlayer.getPlayerState() === 1) return;
            if(toggleBtn) toggleBtn.classList.add('needs-start');
            if(titleEl) titleEl.textContent = 'toque na tela para continuar';
            var evts = ['pointerdown','touchend','click','keydown','scroll'];
            var resume = function(){
              evts.forEach(function(n){ document.removeEventListener(n, resume, true); });
              try{ ytPlayer.unMute(); ytPlayer.setVolume(saved.vol || startVol || 30); ytPlayer.playVideo(); }catch(e){}
              setTimeout(updateTitle, 600);
            };
            evts.forEach(function(n){ document.addEventListener(n, resume, true); });
          }catch(e){}
        }, 900);
      }
      setTimeout(updateTitle, 900);
    }catch(e){}
  }

  function updateTitle(){
    try{
      var data = ytPlayer.getVideoData();
      titleEl.textContent = (data && data.title) ? data.title : 'biyou playlist';
    }catch(e){}
  }

  var stuckTimer = null;
  function clearStuck(){ if(stuckTimer){ clearTimeout(stuckTimer); stuckTimer = null; } }
  function watchStuck(){
    clearStuck();
    // se ficar "carregando" por muito tempo, a faixa provavelmente esta
    // bloqueada para incorporacao: pula para a proxima automaticamente.
    stuckTimer = setTimeout(function(){
      try{
        if(ytPlayer.getPlayerState() !== YT.PlayerState.PLAYING){
          if(titleEl) titleEl.textContent = 'trocando de faixa...';
          goNext(true);
          setTimeout(function(){ try{ ytPlayer.playVideo(); }catch(e){} }, 400);
        }
      }catch(e){}
    }, 9000);
  }

  function onPlayerStateChange(e){
    updateTitle();
    try{ saveState(true); }catch(err){}
    document.dispatchEvent(new CustomEvent('biyou:player-state', { detail: { state: e.data } }));
    if(e.data === YT.PlayerState.BUFFERING){ watchStuck(); }
    else { clearStuck(); }
    if(e.data === YT.PlayerState.ENDED){ goNext(true); }
    if(e.data === YT.PlayerState.PLAYING){
      userPaused = false; lastKnownPlaying = true;
      iconPlay.style.display = 'none'; iconPause.style.display = '';
      toggleBtn.setAttribute('aria-label','pausar');
      orbEl.classList.add('spinning');
      toggleBtn.classList.remove('needs-start');
      startTimer();
    } else {
      iconPlay.style.display = ''; iconPause.style.display = 'none';
      toggleBtn.setAttribute('aria-label','tocar');
      orbEl.classList.remove('spinning');
      stopTimer();
    }
  }


  function startTimer(){
    stopTimer();
    ytTimer = setInterval(function(){
      if(!ytReady) return;
      // aba escondida: nao gastar CPU com UI (evita travadas no mobile)
      if(document.hidden) return;
      var cur = ytPlayer.getCurrentTime ? ytPlayer.getCurrentTime() : 0;
      var dur = ytPlayer.getDuration ? ytPlayer.getDuration() : 0;
      var pct = dur ? (cur/dur*100) : 0;
      var curTxt = fmt(cur), totTxt = fmt(dur), pctTxt = pct.toFixed(2) + '%';
      if(timeCurrent.textContent !== curTxt) timeCurrent.textContent = curTxt;
      if(timeTotal.textContent !== totTxt) timeTotal.textContent = totTxt;
      if(progressFill.style.width !== pctTxt) progressFill.style.width = pctTxt;
      if(progressDot.style.left !== pctTxt) progressDot.style.left = pctTxt;
      saveState();
    }, 1000);
  }
  function stopTimer(){ if(ytTimer){ clearInterval(ytTimer); ytTimer = null; } }

  toggleBtn.addEventListener('click', function(){
    if(!ytReady){
      if(titleEl) titleEl.textContent = 'carregando playlist...';
      createPlayer();
      return;
    }
    var state = ytPlayer.getPlayerState();
    if(state === YT.PlayerState.PLAYING){ userPaused = true; lastKnownPlaying = false; ytPlayer.pauseVideo(); }
    else {
      userPaused = false;
      try{
        ytPlayer.unMute();
        var vol = document.getElementById('biyou-yt-volume');
        ytPlayer.setVolume(vol ? parseInt(vol.value, 10) : 30);
      }catch(e){}
      ytPlayer.playVideo();
      watchStuck();
    }

  });
  // jump=true: abandona a faixa atual e sorteia outra na hora (usado ao
  // ligar o embaralhar). jump=false: mantém a faixa atual tocando e só
  // reorganiza a ordem das próximas (usado ao desligar o embaralhar).
  function applyShuffle(jump){
    if(shuffleBtn){
      shuffleBtn.classList.toggle('is-active', shuffleOn);
      shuffleBtn.setAttribute('aria-pressed', shuffleOn ? 'true' : 'false');
      shuffleBtn.setAttribute('title', shuffleOn ? 'ordem aleatória: ativada' : 'ordem aleatória: desativada');
    }
    if(!ytReady || !playlistIds.length) return;
    if(jump && shuffleOn){
      buildOrder(false);
      var wasPlaying = false;
      try{ wasPlaying = ytPlayer.getPlayerState() === YT.PlayerState.PLAYING; }catch(e){}
      playAt(0, wasPlaying);
    } else {
      buildOrder(true);
    }
  }

  if(shuffleBtn){
    shuffleBtn.addEventListener('click', function(){
      shuffleOn = !shuffleOn;
      applyShuffle(shuffleOn);
    });
  }

  prevBtn.addEventListener('click', function(){ if(ytReady) goPrev(true); });
  nextBtn.addEventListener('click', function(){ if(ytReady) goNext(true); });
  progressBg.addEventListener('click', function(ev){
    if(!ytReady) return;
    var rect = progressBg.getBoundingClientRect();
    var pct = (ev.clientX - rect.left) / rect.width;
    var dur = ytPlayer.getDuration ? ytPlayer.getDuration() : 0;
    if(dur) ytPlayer.seekTo(dur*pct, true);
  });
  var volumeInput = document.getElementById('biyou-yt-volume');
  var muteBtn = document.getElementById('biyou-yt-mute');
  var lastVolume = volumeInput ? parseInt(volumeInput.value, 10) : 30;
  if(volumeInput){
    volumeInput.addEventListener('input', function(){
      var v = parseInt(volumeInput.value, 10);
      if(ytReady) ytPlayer.setVolume(v);
      if(v > 0) lastVolume = v;
    });
  }
  if(muteBtn){
    muteBtn.addEventListener('click', function(){
      var v = parseInt(volumeInput.value, 10);
      if(v > 0){
        lastVolume = v;
        volumeInput.value = 0;
        if(ytReady) ytPlayer.setVolume(0);
      } else {
        volumeInput.value = lastVolume || 30;
        if(ytReady) ytPlayer.setVolume(lastVolume || 30);
      }
    });
  }
})();
</script>
<script>
(function(){
  var wrap = document.querySelector('.biyou-player-wrap');
  if(!wrap) return;

  // deixa um atalho no lugar original da secao da playlist
  var slot = document.createElement('div');
  slot.className = 'biyou-player-slot';
  slot.innerHTML = '<p>o player fica flutuando no canto da tela e continua tocando enquanto voce navega.</p>' +
                   '<button type="button">abrir o player</button>';
  wrap.parentNode.insertBefore(slot, wrap);

  var dock = document.createElement('div');
  dock.id = 'biyou-dock';
  dock.className = 'is-collapsed attention';
  var panel = document.createElement('div');
  panel.className = 'biyou-dock-panel';
  var handle = document.createElement('div');
  handle.className = 'biyou-dock-handle';
  handle.innerHTML = '<span>biyou playlist</span><button type="button" aria-label="minimizar player" title="minimizar">\u2013</button>';
  panel.appendChild(handle);
  panel.appendChild(wrap);
  var bubble = document.createElement('button');
  bubble.id = 'biyou-bubble';
  bubble.type = 'button';
  bubble.setAttribute('aria-label','abrir o player de música');
  bubble.innerHTML = '<span class="biyou-bubble-disc" aria-hidden="true"></span>' +
                     '<span class="biyou-bubble-eq" aria-hidden="true"><i></i><i></i><i></i></span>' +
                     '<span class="biyou-bubble-label">música</span>';
  dock.appendChild(panel);
  dock.appendChild(bubble);
  document.body.appendChild(dock);

  var KEY_UI = 'biyou-player-ui';
  function readUI(){ try{ return JSON.parse(localStorage.getItem(KEY_UI) || 'null') || {}; }catch(e){ return {}; } }
  function saveUI(patch){
    var ui = readUI();
    for(var k in patch) ui[k] = patch[k];
    try{ localStorage.setItem(KEY_UI, JSON.stringify(ui)); }catch(e){}
  }

  function ensureVisible(){
    // depois de expandir, o painel cresce para baixo e pode sair da tela:
    // reposiciona o dock para que ele fique inteiro visivel (e um pouco acima).
    var r = dock.getBoundingClientRect();
    var maxTop = window.innerHeight - r.height - 16;
    var maxLeft = window.innerWidth - r.width - 8;
    var top = Math.min(Math.max(8, r.top), Math.max(8, maxTop));
    var left = Math.min(Math.max(8, r.left), Math.max(8, maxLeft));
    if(Math.abs(top - r.top) > 1 || Math.abs(left - r.left) > 1) place(left, top);
  }
  function setCollapsed(v){
    dock.classList.toggle('is-collapsed', v);
    if(!v){
      dock.classList.remove('attention');
      requestAnimationFrame(function(){ ensureVisible(); setTimeout(ensureVisible, 260); });
    }
    saveUI({ collapsed: v });
  }
  window.addEventListener('resize', function(){ if(!dock.classList.contains('is-collapsed')) ensureVisible(); });
  bubble.addEventListener('click', function(e){ if(dock.dataset.moved === '1'){ dock.dataset.moved = '0'; return; } setCollapsed(false); });
  handle.querySelector('button').addEventListener('click', function(){ setCollapsed(true); });
  slot.querySelector('button').addEventListener('click', function(){
    setCollapsed(false);
    dock.animate([{transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:420,easing:'ease-out'});
  });

  // arrastar o player pela tela
  var drag = null;
  handle.addEventListener('pointerdown', startDrag);
  bubble.addEventListener('pointerdown', startDrag);
  function startDrag(ev){
    if(ev.target.closest('button') && ev.currentTarget === handle) return;
    var r = dock.getBoundingClientRect();
    drag = { x: ev.clientX, y: ev.clientY, left: r.left, top: r.top, moved: false };
    dock.setPointerCapture && dock.setPointerCapture(ev.pointerId);
    ev.currentTarget.setPointerCapture(ev.pointerId);
    dock.classList.add('is-dragging');
  }
  function onMove(ev){
    if(!drag) return;
    var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if(Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
    var r = dock.getBoundingClientRect();
    var left = Math.min(Math.max(8, drag.left + dx), window.innerWidth - r.width - 8);
    var top  = Math.min(Math.max(8, drag.top + dy), window.innerHeight - r.height - 8);
    place(left, top);
  }
  function place(left, top){
    dock.style.left = left + 'px';
    dock.style.top = top + 'px';
    dock.style.right = 'auto';
    dock.style.bottom = 'auto';
    saveUI({ left: left, top: top });
  }
  function endDrag(){
    if(!drag) return;
    dock.dataset.moved = drag.moved ? '1' : '0';
    drag = null;
    dock.classList.remove('is-dragging');
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  // estado salvo da interface
  var ui = readUI();
  if(ui.collapsed === false) setCollapsed(false);

  // sincroniza titulo/estado com a bolha
  var titleEl = document.getElementById('biyou-yt-title');
  var label = bubble.querySelector('.biyou-bubble-label');
  function syncLabel(){
    var t = titleEl ? titleEl.textContent.trim() : '';
    label.textContent = (t && t.indexOf('carregando') === -1) ? t : 'música';
    bubble.title = label.textContent;
  }
  if(titleEl) new MutationObserver(syncLabel).observe(titleEl, { childList:true, characterData:true, subtree:true });
  syncLabel();

  document.addEventListener('biyou:player-state', function(e){
    var playing = e.detail && e.detail.state === 1;
    dock.classList.toggle('is-playing', playing);
    if(playing) dock.classList.remove('attention');
  });
})();
</script>
<script>
(function(){
  var box,img,cnt,list=[],i=0;
  function mk(){box=document.createElement('div');box.className='lb';
    box.innerHTML='<button class="lx" type="button" aria-label="fechar">✕</button><button class="lp" type="button" aria-label="anterior">‹</button><img alt="imagem"><button class="ln" type="button" aria-label="próxima">›</button><div class="lc"></div>';
    document.body.appendChild(box);img=box.querySelector('img');cnt=box.querySelector('.lc');
    box.onclick=function(e){if(e.target===box||e.target.className==='lx')fecha()};
    box.querySelector('.lp').onclick=function(e){e.stopPropagation();vai(-1)};box.querySelector('.ln').onclick=function(e){e.stopPropagation();vai(1)}}
  function mostra(){img.src=list[i];var m=list.length>1;box.querySelector('.lp').style.display=box.querySelector('.ln').style.display=m?'':'none';cnt.textContent=m?(i+1)+' / '+list.length:''}
  function vai(d){i=(i+d+list.length)%list.length;mostra()}
  function fecha(){box.classList.remove('open');img.removeAttribute('src')}
  document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a.lbx');if(!a)return;e.preventDefault();
    var g=[].slice.call((a.closest('.thumbs')||document).querySelectorAll('a.lbx'));list=g.map(function(x){return x.href});i=Math.max(0,g.indexOf(a));
    if(!box)mk();box.classList.add('open');mostra()});
  document.addEventListener('keydown',function(e){if(!box||!box.classList.contains('open'))return;if(e.key==='Escape')fecha();if(e.key==='ArrowLeft')vai(-1);if(e.key==='ArrowRight')vai(1)});
})();
</script>
</body>
</html>
