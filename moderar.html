<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>biyou nails — avaliações</title>
<style>
@font-face{font-family:Fogthree;src:url('/fonts/fogthree.woff') format('woff');font-display:swap}
:root{--bg:oklch(99% .006 95);--fg:oklch(32% .03 285);--muted:oklch(56% .03 290);--card:#fff;--border:oklch(93% .015 310);--primary:oklch(74% .11 310);--star:oklch(83% .11 60)}
@media(prefers-color-scheme:dark){:root{--bg:oklch(18% .025 295);--fg:oklch(94% .012 300);--muted:oklch(73% .03 300);--card:oklch(23% .03 305);--border:oklch(34% .035 305)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Manrope",-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:40px 20px 80px}
h1{font-family:Fogthree,Georgia,serif;font-weight:400;font-size:2rem;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 22px;font-size:.9rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tabs button{border:1px solid var(--border);background:var(--card);color:var(--fg);border-radius:99px;padding:7px 16px;font:inherit;font-size:.82rem;cursor:pointer}
.tabs button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.item{background:var(--card);border:1px solid var(--border);border-radius:1.25rem;padding:18px;margin-bottom:14px;display:flex;gap:16px}
.item img{width:110px;height:110px;object-fit:cover;border-radius:14px;border:1px solid var(--border);flex:none;cursor:zoom-in}
.item .corpo{min-width:0;flex:1}
.st{color:var(--star);font-size:1.15rem;letter-spacing:2px}
.item p{margin:6px 0;font-size:.92rem;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{font-size:.76rem;color:var(--muted)}
.tag{display:inline-block;font-size:.7rem;border-radius:99px;padding:2px 10px;margin-right:6px;border:1px solid var(--border)}
.tag.pendente{background:oklch(95% .05 85);color:oklch(40% .08 70)}
.tag.aprovada{background:oklch(94% .06 150);color:oklch(38% .08 150)}
.tag.recusada{background:oklch(94% .04 20);color:oklch(40% .1 20)}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acoes button{border:1px solid var(--border);background:none;color:var(--fg);border-radius:99px;padding:7px 16px;font:inherit;font-size:.8rem;cursor:pointer}
.acoes .ok{background:var(--primary);border-color:var(--primary);color:#fff}
.vazio,.erro{text-align:center;color:var(--muted);padding:60px 0}
a{color:var(--primary)}
@media(max-width:520px){.item{flex-direction:column}.item img{width:100%;height:auto;aspect-ratio:1}}
</style>
</head>
<body>
<main>
  <h1>avaliações</h1>
  <p class="sub">aprove para aparecer no site. só aparece se a cliente autorizou.</p>
  <div class="tabs" id="tabs"></div>
  <div id="lista"><p class="vazio">carregando…</p></div>
</main>
<script>
(function(){
  var FILTROS=[['pendente','para aprovar'],['aprovada','aprovadas'],['recusada','recusadas'],['todas','todas']],f='pendente',dados=[];
  var $=function(i){return document.getElementById(i)};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var est=function(n){var s='';for(var i=1;i<=5;i++)s+=i<=n?'★':'☆';return s};
  var dt=function(d){try{return new Date(d).toLocaleDateString('pt-BR')}catch(e){return ''}};

  function carregar(){
    fetch('/api/avaliacoes?todas=1').then(function(r){
      if(r.status===401){$('lista').innerHTML='<p class="erro">você precisa estar logada. entre no <a href="/admin.html">painel</a> e volte aqui.</p>';return null}
      if(!r.ok)throw 0;return r.json()
    }).then(function(l){if(l){dados=l;desenhar()}})
    .catch(function(){$('lista').innerHTML='<p class="erro">não consegui carregar. tente de novo.</p>'});
  }
  function desenhar(){
    $('tabs').innerHTML=FILTROS.map(function(x){
      var n=x[0]==='todas'?dados.length:dados.filter(function(a){return a.status===x[0]}).length;
      return '<button type="button" data-f="'+x[0]+'"'+(x[0]===f?' class="on"':'')+'>'+x[1]+' ('+n+')</button>'}).join('');
    var l=dados.filter(function(a){return f==='todas'||a.status===f});
    $('lista').innerHTML=l.length?l.map(function(a){
      var u=a.foto?'/api/avaliacoes?img='+a.foto:'';
      return '<div class="item">'+(u?'<a href="'+u+'" target="_blank" rel="noopener"><img src="'+u+'" alt="foto da avaliação" loading="lazy"></a>':'')+
        '<div class="corpo"><span class="tag '+esc(a.status)+'">'+esc(a.status)+'</span>'+(a.autoriza?'':'<span class="tag">não autorizou mostrar no site</span>')+
        '<div class="st" aria-label="'+a.nota+' de 5">'+est(a.nota)+'</div>'+
        (a.texto?'<p>'+esc(a.texto)+'</p>':'<p class="meta">sem comentário</p>')+
        '<div class="meta">'+esc(a.cliente)+(a.pedido?' · '+esc(a.pedido):'')+' · '+dt(a.data)+'</div>'+
        '<div class="acoes">'+(a.status!=='aprovada'?'<button class="ok" data-a="aprovar" data-id="'+a.id+'">aprovar</button>':'')+
        (a.status!=='recusada'?'<button data-a="recusar" data-id="'+a.id+'">recusar</button>':'')+
        '<button data-a="apagar" data-id="'+a.id+'">apagar</button></div></div></div>'}).join(''):'<p class="vazio">nada por aqui.</p>';
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button');if(!b)return;
    if(b.dataset.f){f=b.dataset.f;desenhar();return}
    if(!b.dataset.a)return;
    if(b.dataset.a==='apagar'&&!confirm('apagar essa avaliação e a foto de vez?'))return;
    b.disabled=true;
    fetch('/api/avaliacoes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:b.dataset.a,id:b.dataset.id})})
    .then(function(r){if(!r.ok)throw 0;carregar()})
    .catch(function(){b.disabled=false;alert('não deu certo, tente de novo')});
  });
  carregar();
})();
</script>
</body>
</html>
